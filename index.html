<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もじあそび</title>
<meta name="description" content="字を積む、量る、分ける。ひらがな・カタカナ・漢字の形で遊ぶ3つのゲーム。全国ランキングあり。">
<meta property="og:type" content="website">
<meta property="og:title" content="もじあそび">
<meta property="og:description" content="字を積む、量る、分ける。ひらがな・カタカナ・漢字の形で遊ぶ3つのゲーム。全国ランキングあり。">
<meta property="og:image" content="https://ggrr514-collab.github.io/moji/og.png">
<meta property="og:url" content="https://ggrr514-collab.github.io/moji/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#cf3f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじあそび">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#f6f7f2; --paper:#fdfdfb; --ink:#1c1e1b; --muted:#666b62; --grid:#d98a6f;
  --accent:#cf3f26; --desk:#a9814f; --deskdark:#7a5a33; --panel:#ffffff; --line:#e3e2da; --good:#2c7a4b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16271f; --paper:#1d362b; --ink:#f2f0e6; --muted:#a8b8ad; --grid:#9fc0ad;
  --accent:#ff8a66; --desk:#b08d5c; --deskdark:#7d5d3b; --panel:#20392e; --line:#2f4c3f; --good:#8fd6a8; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--display);font-size:46px;line-height:1;display:flex;gap:2px;margin:0;font-weight:400}
.logo span{display:inline-block;border:2px solid var(--grid);background:var(--paper);padding:4px 2px 6px}
.logo span:nth-child(n+3){color:var(--accent)}
.lead{color:var(--muted);margin:0;line-height:1.7}
.games li{min-width:0}
.games{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.game{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;
  border:1.5px solid var(--ink);background:var(--panel);border-radius:12px;padding:12px}
.game:active{transform:translateY(1px)}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pic{width:92px;height:92px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:block;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:23px 23px}
.pic text{font-family:var(--body);font-weight:900;fill:var(--ink)}
.txt{display:flex;flex-direction:column;gap:5px;min-width:0}
.name{font-family:var(--display);font-size:24px;line-height:1.1}
.desc{font-size:13.5px;line-height:1.6;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.todo{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tag.done{border-color:var(--good);color:var(--good)}
.foot{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
</style>
</head><body>
<main>
  <h1 class="logo" aria-label="もじあそび"><span>も</span><span>じ</span><span>あ</span><span>そ</span><span>び</span></h1>
  <p class="lead">字を積む、量る、分ける。字の形で遊ぶ3つのゲーム。</p>
  <ul class="games">
    <li><a class="game" href="../mojitsumi/">
      <svg class="pic" viewBox="0 0 92 92" aria-hidden="true">
        <rect x="14" y="80" width="64" height="6" fill="var(--desk)"/>
        <text x="46" y="78" font-size="30" text-anchor="middle">山</text>
        <text x="40" y="52" font-size="28" text-anchor="middle" transform="rotate(-14 40 42)">も</text>
        <text x="52" y="27" font-size="24" text-anchor="middle" transform="rotate(20 52 19)" style="fill:var(--accent)">ツ</text>
      </svg>
      <span class="txt"><span class="name">もじつみ</span>
        <span class="desc">打った字が、その字の形のまま落ちてくる。崩さずにどこまで積めるか。</span>
        <span class="tags"><span class="tag">いつでも何回でも</span></span></span></a></li>
    <li><a class="game" href="../mojihakari/">
      <svg class="pic" viewBox="0 0 92 92" aria-hidden="true">
        <path d="M46 30V82M30 84H62" stroke="var(--deskdark)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <g transform="rotate(-9 46 30)">
          <path d="M12 30H80" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>
          <text x="16" y="27" font-size="22" text-anchor="middle">鬱</text>
          <text x="76" y="27" font-size="22" text-anchor="middle" style="fill:var(--accent)">国</text>
        </g>
        <circle cx="46" cy="30" r="4" fill="var(--accent)"/>
      </svg>
      <span class="txt"><span class="name">もじはかり</span>
        <span class="desc">字の重さは、黒い部分の広さ。お題とぴったり釣り合う言葉を天秤に載せる。</span>
        <span class="tags"><span class="tag">1日1問</span><span class="tag" id="stHakari" hidden></span></span></span></a></li>
    <li><a class="game" href="../mojiwake/">
      <svg class="pic" viewBox="0 0 92 92" aria-hidden="true">
        <defs><clipPath id="cL"><path d="M0 0H52L36 92H0Z"/></clipPath><clipPath id="cR"><path d="M52 0H92V92H36Z"/></clipPath></defs>
        <text x="44" y="68" font-size="62" text-anchor="middle" clip-path="url(#cL)">字</text>
        <text x="48" y="68" font-size="62" text-anchor="middle" clip-path="url(#cR)" style="fill:var(--accent)">字</text>
        <path d="M54 4L36 88" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <span class="txt"><span class="name">もじわけ</span>
        <span class="desc">線を1本。字の黒いところを、ちょうど半分に分けられるか。</span>
        <span class="tags"><span class="tag">1日5字</span><span class="tag" id="stWake" hidden></span></span></span></a></li>
  </ul>
  <p class="foot">どれも無料で、登録はいりません。名前を入れると全国ランキングに載ります。日替わりの問題は毎日0時に変わります。</p>
</main>
<script>
// 同じ端末で今日の分を遊んだかどうか（各ゲームがこの端末に残した記録を見るだけ）
(function(){
  var today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{};}catch(e){return {};}}
  function mark(id,key){var el=document.getElementById(id),s=get(key),done=s.day===today&&s.done;
    el.textContent=done?'今日の分 済み':'今日の分 まだ';el.className='tag '+(done?'done':'todo');el.hidden=false;}
  function all(){mark('stHakari','mojihakari_daily');mark('stWake','mojiwake_daily');}
  all();addEventListener('pageshow',all);document.addEventListener('visibilitychange',all);
})();
</script>
</body></html>
