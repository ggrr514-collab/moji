<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>もじあそび</title>
<meta name="description" content="字を積む、掛ける、量る、分ける。ひらがな・カタカナ・漢字の形で遊ぶ4つのゲーム。全国ランキングあり。">
<meta property="og:type" content="website">
<meta property="og:title" content="もじあそび">
<meta property="og:description" content="字を積む、掛ける、量る、分ける。ひらがな・カタカナ・漢字の形で遊ぶ4つのゲーム。全国ランキングあり。">
<meta property="og:image" content="https://ggrr514-collab.github.io/moji/og.png">
<meta property="og:url" content="https://ggrr514-collab.github.io/moji/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#cf3f26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="もじあそび">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#f6f7f2; --paper:#fdfdfb; --ink:#1c1e1b; --muted:#666b62; --grid:#d98a6f;
  --accent:#cf3f26; --desk:#a9814f; --deskdark:#7a5a33; --panel:#ffffff; --line:#e3e2da; --good:#2c7a4b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16271f; --paper:#1d362b; --ink:#f2f0e6; --muted:#a8b8ad; --grid:#9fc0ad;
  --accent:#ff8a66; --desk:#b08d5c; --deskdark:#7d5d3b; --panel:#20392e; --line:#2f4c3f; --good:#8fd6a8; color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;
  padding:calc(28px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.logo{font-family:var(--display);font-size:46px;line-height:1;display:flex;gap:2px;margin:0;font-weight:400}
.logo span{display:inline-block;border:2px solid var(--grid);background:var(--paper);padding:4px 2px 6px}
.logo span:nth-child(n+3){color:var(--accent)}
.lead{color:var(--muted);margin:0;line-height:1.7}
.games li{min-width:0}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px;list-style:none;margin:0;padding:0}
.game{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;
  border:1.5px solid var(--ink);background:var(--panel);border-radius:12px;padding:8px 8px 10px}
.game:active{transform:translateY(1px)}
.game:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{display:block;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.hero img{display:block;width:100%;height:auto}
.hero .d{display:none}
@media (prefers-color-scheme: dark){.hero .l{display:none}.hero .d{display:block}}
.name{font-family:var(--display);font-size:20px;line-height:1.1;padding:0 2px}
.tags{padding:0 2px;display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:700}
.tag{border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.tag.todo{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tag.done{border-color:var(--good);color:var(--good)}
.foot{font-size:12px;color:var(--muted);margin:0;line-height:1.7}
</style>
</head><body>
<main>
  <h1 class="logo" aria-label="もじあそび"><span>も</span><span>じ</span><span>あ</span><span>そ</span><span>び</span></h1>
  <ul class="games">
    <li><a class="game" href="../mojitsumi/">
      <span class="hero"><img class="l" src="scene-tsumi.png" alt="字を積んでいる場面" width="720" height="720"><img class="d" src="scene-tsumi-dark.png" alt="" width="720" height="720"></span>
      <span class="name">もじつみ</span>
      <span class="tags"><span class="tag">何回でも</span></span></a></li>
    <li><a class="game" href="../mojikake/">
      <span class="hero"><img class="l" src="scene-kake.png" alt="糸に字が掛かっている場面" width="720" height="720"><img class="d" src="scene-kake-dark.png" alt="" width="720" height="720"></span>
      <span class="name">もじかけ</span>
      <span class="tags"><span class="tag">何回でも</span></span></a></li>
    <li><a class="game" href="../mojihakari/">
      <span class="hero"><img class="l" src="scene-hakari.png" alt="天秤に言葉を載せている場面" width="720" height="720"><img class="d" src="scene-hakari-dark.png" alt="" width="720" height="720"></span>
      <span class="name">もじはかり</span>
      <span class="tags"><span class="tag">1日1問</span><span class="tag" id="stHakari" hidden></span></span></a></li>
    <li><a class="game" href="../mojiwake/">
      <span class="hero"><img class="l" src="scene-wake.png" alt="字を線で2つに分けた場面" width="720" height="720"><img class="d" src="scene-wake-dark.png" alt="" width="720" height="720"></span>
      <span class="name">もじわけ</span>
      <span class="tags"><span class="tag">1日5字</span><span class="tag" id="stWake" hidden></span></span></a></li>
  </ul>
</main>
<script>
// 同じ端末で今日の分を遊んだかどうか（各ゲームがこの端末に残した記録を見るだけ）
(function(){
  var today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  function get(k){try{return JSON.parse(localStorage.getItem(k)||'null')||{};}catch(e){return {};}}
  function mark(id,key){var el=document.getElementById(id),s=get(key),done=s.day===today&&s.done;
    el.textContent=done?'今日の分 済み':'今日の分 まだ';el.className='tag '+(done?'done':'todo');el.hidden=false;}
  function all(){mark('stHakari','mojihakari_daily');mark('stWake','mojiwake_daily');}
  all();addEventListener('pageshow',all);document.addEventListener('visibilitychange',all);
})();
</script>
</body></html>
